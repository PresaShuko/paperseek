name: Publish Community and MCP packages to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check independent MCP lock
        run: |
          python -m pip install uv==0.9.24
          uv lock --check --project integrations/mcp

      - name: Build exact-version Community wheel first
        run: |
          python -m pip install twine
          uv build --wheel --out-dir dist backend

      - name: Build independent MCP wheel second
        run: uv build --wheel --out-dir dist integrations/mcp

      - name: Verify both release candidates
        run: |
          python -m twine check dist/*
          uv venv .release-check --python 3.12
          uv pip install --python .release-check/bin/python \
            dist/paperseek-1.0.0b1-py3-none-any.whl \
            dist/paperseek_mcp-1.0.0b1-py3-none-any.whl
          .release-check/bin/python -c "import importlib.metadata as m; assert m.version('paperseek') == m.version('paperseek-mcp') == '1.0.0b1'; assert 'paperseek==1.0.0b1' in (m.requires('paperseek-mcp') or [])"
          .release-check/bin/python -c "from paperseek_app import build_info as b; assert b.COMMUNITY_COMMIT == '${GITHUB_SHA}'; assert b.SOURCE_TREE_DIRTY is False"
          .release-check/bin/paperseek version
          .release-check/bin/paperseek-mcp --help

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: community-and-mcp-python-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: community-and-mcp-python-dist
          path: dist

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          attestations: false
