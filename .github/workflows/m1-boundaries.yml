name: M1 package boundaries

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - ".github/workflows/m1-boundaries.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - ".github/workflows/m1-boundaries.yml"

jobs:
  backend-boundaries:
    name: Backend boundaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.9.24

      - name: Sync locked backend
        run: uv sync --locked

      - name: Check package imports and dependency direction
        run: uv run --locked python -m unittest discover -s tests -p "import_boundaries.py"

      - name: Check M1 durable run contract
        run: uv run --locked python -m unittest discover -s tests/contract -p "*_contract.py"

      - name: Check M1 CLI and REST entries
        run: uv run --locked python -m unittest discover -s tests/integration -p "*_integration.py"

      - name: Check database migrations and recovery
        run: uv run --locked python -m unittest discover -s tests/migration -p "*.py"

      - name: Build backend wheel
        run: uv build --out-dir dist

  web-build:
    name: Web build (Node 22.14.0)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked web dependencies
        run: npm ci

      - name: Check generated OpenAPI TypeScript
        working-directory: backend
        run: uv run --locked python scripts/generate_openapi_types.py --check

      - name: Type-check web skeleton
        run: npm run typecheck

      - name: Build web skeleton
        run: npm run build
