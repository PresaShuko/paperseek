[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperseek"
version = "0.3.0"
description = "PaperSeek Community backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.1",
    "cryptography==49.0.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "sqlalchemy==2.0.51",
    "uvicorn==0.52.1",
]

[project.scripts]
paperseek = "paperseek_community.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["paperseek_core*", "paperseek_app*", "paperseek_community*"]

[tool.setuptools.package-data]
paperseek_community = ["static/**/*"]
