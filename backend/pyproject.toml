[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperseek"
version = "0.3.0"
description = "PaperSeek Community backend"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "MingfengHong", email = "hongmingfeng24@mails.ucas.ac.cn" },
]
maintainers = [
    { name = "MingfengHong", email = "hongmingfeng24@mails.ucas.ac.cn" },
]
keywords = ["literature-search", "openalex", "crossref", "web-of-science", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "alembic==1.19.1",
    "cryptography==49.0.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "sqlalchemy==2.0.51",
    "uvicorn==0.52.1",
]

[project.urls]
Homepage = "https://www.paperseek.top/"
Repository = "https://github.com/MingfengHong/paperseek"
Issues = "https://github.com/MingfengHong/paperseek/issues"
Documentation = "https://docs.paperseek.top/"
Online-Demo = "https://www.paperseek.top/"

[project.scripts]
paperseek = "paperseek_community.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["paperseek_core*", "paperseek_app*", "paperseek_community*"]

[tool.setuptools.package-data]
paperseek_community = ["static/**/*"]
